name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # 禁用默认 GITHUB_TOKEN 的凭证

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

        name: Build run: npm run build

        name: Copy index to 404 for SPA routing run: cp ./dist/index.html ./dist/404.html

        name: Deploy to GitHub Pages uses: peaceiris/actions-gh-pages@v3 with: github_token: ${{ secrets.PAGES_PAT }} publish_branch: gh-pages publish_dir: ./dist allow_empty_commit: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PAGES_PAT }}   # 用我们添加的 PAT
          publish_branch: gh-pages
          publish_dir: ./dist
          allow_empty_commit: true
